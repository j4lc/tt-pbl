stages:
  - build

default:
  image: ghcr.io/astral-sh/uv:debian

cache:
  key: $CI_PROJECT_NAME
  paths:
    - ~/.local/share/uv/tools/

build:
  stage: build
  before_script:
    - uv tool install pebble-tool
    - pebble sdk install latest
  script:
    - pebble build
  artifacts:
    paths:
      - build/
